name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789012345
          BETTER_AUTH_URL: http://127.0.0.1:3000
          AUTH_DATABASE_URL: postgresql://dce_auth:dce_auth@localhost:5432/dce
          WEB_DATABASE_URL: postgresql://dce_web:dce_web@localhost:5432/dce

      - name: Unit tests
        run: pnpm run test:unit

      - name: Boundary checker tests
        run: pnpm run test:boundaries

      - name: Dependency boundaries
        run: pnpm run check:boundaries

      - name: Documentation links
        run: pnpm run check:links

      - name: Install gitleaks
        run: sudo bash scripts/install-gitleaks.sh

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_ARGS=(--config .gitleaks.toml)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "Scanning PR commit range ${BASE}..${HEAD}"
            gitleaks detect --source . --redact --verbose "${CONFIG_ARGS[@]}" --log-opts="${BASE}..${HEAD}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "Scanning push commit range ${{ github.event.before }}..${{ github.sha }}"
            gitleaks detect --source . --redact --verbose "${CONFIG_ARGS[@]}" --log-opts="${{ github.event.before }}..${{ github.sha }}"
          else
            echo "Scanning full repository history"
            gitleaks detect --source . --redact --verbose "${CONFIG_ARGS[@]}"
          fi

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: dce
          POSTGRES_PASSWORD: dce_test
          POSTGRES_DB: dce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dce -d dce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://dce:dce_test@localhost:5432/dce
      MIGRATOR_DATABASE_URL: postgresql://dce_migrator:dce_migrator@localhost:5432/dce
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database roles
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
        env:
          PGPASSWORD: dce_test

      - name: Apply migrations as dce_migrator
        run: pnpm run db:migrate

      - name: Typecheck
        run: pnpm run typecheck

      - name: PostgreSQL integration tests
        run: pnpm run test:integration

      - name: pg-boss privilege verification
        run: pnpm run db:verify-pgboss
