name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Boundary checker tests
        run: pnpm run test:boundaries

      - name: Dependency boundaries
        run: pnpm run check:boundaries

      - name: Documentation links
        run: pnpm run check:links

      - name: Install gitleaks
        run: sudo bash scripts/install-gitleaks.sh

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "Scanning PR commit range ${BASE}..${HEAD}"
            gitleaks detect --source . --redact --verbose --log-opts="${BASE}..${HEAD}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "Scanning push commit range ${{ github.event.before }}..${{ github.sha }}"
            gitleaks detect --source . --redact --verbose --log-opts="${{ github.event.before }}..${{ github.sha }}"
          else
            echo "Scanning full repository history"
            gitleaks detect --source . --redact --verbose
          fi

      - name: Dependency audit
        run: pnpm audit --audit-level=high
